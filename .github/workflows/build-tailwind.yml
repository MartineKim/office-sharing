name: Build static Tailwind CSS
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'industry.html'
      - 'tailwind.config.cjs'
      - 'src/tailwind.css'
      - 'package.json'
      - '.github/workflows/build-tailwind.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Tailwind compiler
        run: npm install --no-audit --no-fund
      - name: Build production CSS
        run: npm run build:css
      - name: Commit generated CSS when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tailwind.css
          if ! git diff --cached --quiet; then
            git commit -m "chore: compile Tailwind CSS [skip ci]"
            git push
          fi
